<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all products</title>
<meta name="description" content="Browse every category, set your budget and find your next favorite product.">
<meta name="theme-color" content="#050814">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%233D6BFF'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23050814'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Manrope:wght@500;600;700;800&family=Oxanium:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main id="main">

<section class="phead">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a> / Shop</nav>
    <h1 class="h" id="title">All products</h1>
    <p>Every product here has to earn its place. Filter by category, set your budget, sort your way, then fill the cart. Free shipping unlocks as your order grows.</p>
    <p class="found" id="found"></p>
  </div>
</section>
<section class="sec tight">
  <div class="wrap shopgrid">
    <aside class="side" aria-label="Filters">
      <div><h3>Categories</h3><div class="cats" id="cats"></div></div>
      <div class="price-f"><h3>Max price</h3>
        <input type="range" id="max" min="0" max="60" step="1" value="60" aria-label="Maximum price"><output id="maxOut"></output></div>
      <div class="sort"><h3>Sort by</h3>
        <select id="sort" aria-label="Sort products">
          <option value="pop">Featured</option>
          <option value="asc">Price: low to high</option>
          <option value="desc">Price: high to low</option>
        </select></div>
    </aside>
    <div><div class="grid" id="grid" aria-live="polite"></div></div>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="/app.js" defer></script>
</body>
</html>
