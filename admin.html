<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ok:#16a34a;--ko:#dc2626;--wa:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#eceef2;--mu:#9aa1ae;--bd:#2a2f3a;--ac:#5b8cff;--ok:#34d27b;--ko:#ff6b6b;--wa:#f5a524}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k small{color:var(--mu);display:block}.k b{font-size:20px}
.pos{color:var(--ok)}.neg{color:var(--ko)}
input,select,button.b{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button.b{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);width:auto;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.ins div{padding:8px 10px;border-left:3px solid var(--ac);background:var(--bg);margin-bottom:6px;border-radius:0 8px 8px 0}
.ins .w1{border-color:var(--wa)}.ins .e1{border-color:var(--ko)}.ins .o1{border-color:var(--ok)}
.ch{display:flex;align-items:flex-end;gap:10px;height:140px}
.ch div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.ch span{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:110px}
.ch span i{width:42%;border-radius:3px 3px 0 0;min-height:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.hid{display:none}
</style>
</head>
<body>
<div class="w">
 <div class="top"><h1>📊 Administration</h1><input type="month" id="mo" style="width:auto"></div>
 <nav id="nv"></nav>

 <section id="p-dash">
  <div class="g" id="kp"></div>
  <div class="card" style="margin-top:12px"><h2>Analyse intelligente</h2><div class="ins" id="in"></div></div>
  <div class="card"><h2>6 derniers mois</h2><div class="ch" id="ch"></div>
   <small style="color:var(--mu)"><b style="color:var(--ok)">■</b> Revenus &nbsp;<b style="color:var(--ko)">■</b> Dépenses</small></div>
  <div class="card"><h2>Taxes du mois (TPS 5 % + TVQ 9,975 %)</h2><div class="g" id="tx"></div></div>
 </section>

 <section id="p-ops" class="hid">
  <div class="card"><h2>Ajouter une opération</h2>
   <div class="f">
    <div><label>Type</label><select id="ty"><option value="r">Revenu</option><option value="d">Dépense</option></select></div>
    <div><label>Date</label><input type="date" id="dt"></div>
    <div><label>Description</label><input id="ds" placeholder="Ex: Commande #12"></div>
    <div><label>Catégorie</label><input id="ct" list="cl" placeholder="Ex: Ventes en ligne"></div>
    <div><label>Montant avant taxes ($)</label><input type="number" step="0.01" id="am" inputmode="decimal"></div>
    <div><label>Taxable (TPS/TVQ)</label><select id="tb"><option value="1">Oui</option><option value="0">Non</option></select></div>
    <div id="sw"><label>Frais Stripe auto (2,9 % + 0,30 $)</label><select id="st"><option value="0">Non</option><option value="1">Oui</option></select></div>
    <div><button class="b" id="ad">Ajouter</button></div>
   </div>
   <datalist id="cl"><option>Ventes en ligne</option><option>Ventes sur place</option><option>Ingrédients</option><option>Salaires</option><option>Loyer</option><option>Marketing</option><option>Frais Stripe</option><option>Livraison</option><option>Équipement</option><option>Abonnements</option><option>Autre</option></datalist>
  </div>
  <div class="card"><h2>Opérations du mois</h2><div class="tw"><table id="tb1"></table></div></div>
 </section>

 <section id="p-goal" class="hid">
  <div class="card"><h2>Mes objectifs</h2>
   <div class="f">
    <div><label>Revenus du mois ($)</label><input type="number" id="g1" inputmode="decimal"></div>
    <div><label>Profit net du mois ($)</label><input type="number" id="g2" inputmode="decimal"></div>
    <div><label>Revenus de l'année ($)</label><input type="number" id="g3" inputmode="decimal"></div>
    <div><button class="b" id="gs">Enregistrer</button></div>
   </div>
  </div>
  <div class="card" id="gp"></div>
 </section>

 <section id="p-set" class="hid">
  <div class="card"><h2>Sauvegarde</h2>
   <p style="color:var(--mu);margin-top:0">Les données restent dans ce navigateur seulement. Exporte une sauvegarde régulièrement.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="s" id="ej">Exporter (JSON)</button>
    <button class="s" id="ec">Exporter (CSV)</button>
    <button class="s" id="ij">Importer JSON</button>
    <input type="file" id="fi" accept=".json" class="hid">
   </div>
  </div>
 </section>
</div>

<script>
const KEY='admin_data_v1',TPS=.05,TVQ=.09975;
let D=null;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
D=D||{tx:[],goals:{m:0,p:0,y:0}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const today=new Date().toLocaleDateString('sv');
let mon=today.slice(0,7);
const $$=n=>(n||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inM=m=>D.tx.filter(t=>t.date.startsWith(m));
const sum=(l,ty)=>l.filter(t=>t.ty===ty).reduce((a,t)=>a+t.am,0);
const tax=(l,ty)=>l.filter(t=>t.ty===ty&&t.tb).reduce((a,t)=>({s:a.s+t.am*TPS,v:a.v+t.am*TVQ}),{s:0,v:0});
const prev=(m,n)=>{const d=new Date(m+'-01T12:00');d.setMonth(d.getMonth()-n);return d.toLocaleDateString('sv').slice(0,7)};
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;

const tabs=[['dash','Tableau de bord'],['ops','Opérations'],['goal','Objectifs'],['set','Sauvegarde']];
$('#nv').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$('#nv').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
 tabs.forEach(x=>$('#p-'+x[0]).classList.toggle('hid',x[0]!==t));
 [...$('#nv').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t))};
$('#nv').children[0].click();

function render(){
 const L=inM(mon),R=sum(L,'r'),E=sum(L,'d'),P=R-E,M=R?P/R*100:0;
 const k=(l,v,c)=>`<div class="card k"><small>${l}</small><b class="${c||''}">${v}</b></div>`;
 $('#kp').innerHTML=k('Revenus',$$(R),'pos')+k('Dépenses',$$(E),'neg')+k('Profit net',$$(P),P>=0?'pos':'neg')+k('Marge',M.toFixed(1)+' %');
 const tr=tax(L,'r'),td=tax(L,'d'),due=tr.s+tr.v-td.s-td.v;
 $('#tx').innerHTML=k('Perçues (ventes)',$$(tr.s+tr.v))+k('Payées (dépenses)',$$(td.s+td.v))+k('À remettre (est.)',$$(due),due>0?'neg':'pos')+k('TPS / TVQ à remettre',$$(tr.s-td.s)+' / '+$$(tr.v-td.v));

 // Analyse
 const now=mon===today.slice(0,7),[y,mm]=mon.split('-').map(Number),dim=new Date(y,mm,0).getDate();
 const el=now?+today.slice(8):dim,left=dim-el,I=[];
 const add=(c,t)=>I.push(`<div class="${c}">${t}</div>`);
 if(!L.length)add('','Aucune opération ce mois-ci. Ajoute tes revenus et dépenses dans l\'onglet Opérations.');
 else{
  if(now&&el>2)add('',`Rythme actuel: <b>${$$(R/el)}</b>/jour. Projection fin de mois: <b>${$$(R/el*dim)}</b> en revenus, <b>${$$(P/el*dim)}</b> de profit.`);
  const pm=sum(inM(prev(mon,1)),'r');
  if(pm>0){const v=(R-pm)/pm*100;add(v>=0?'o1':'w1',`Revenus ${v>=0?'en hausse':'en baisse'} de <b>${Math.abs(v).toFixed(1)} %</b> vs le mois précédent (${$$(pm)}).`)}
  if(R>0&&E/R>.7)add('e1',`Tes dépenses représentent <b>${(E/R*100).toFixed(0)} %</b> de tes revenus. Marge très serrée.`);
  else if(P>0)add('o1',`Marge saine de ${M.toFixed(1)} %.`);
  if(P<0)add('e1',`Tu es en perte de <b>${$$(-P)}</b> ce mois-ci.`);
  const c={};L.filter(t=>t.ty==='d').forEach(t=>c[t.ct||'Autre']=(c[t.ct||'Autre']||0)+t.am);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  if(top)add('',`Plus grosse dépense: <b>${esc(top[0])}</b> (${$$(top[1])}, ${(top[1]/E*100).toFixed(0)} % des dépenses).`);
  if(due>0)add('w1',`Mets de côté environ <b>${$$(due)}</b> pour les taxes à remettre.`);
  const fs=L.filter(t=>t.ct==='Frais Stripe').reduce((a,t)=>a+t.am,0);
  if(fs>0)add('',`Frais Stripe ce mois-ci: ${$$(fs)} (${(fs/R*100).toFixed(1)} % des revenus).`);
 }
 const G=D.goals;
 if(G.m>0&&R<G.m&&now&&left>0)add('',`Pour atteindre ton objectif de revenus, il te faut <b>${$$((G.m-R)/left)}</b>/jour pour les ${left} jours restants.`);
 if(G.m>0&&R>=G.m)add('o1','🎯 Objectif de revenus du mois atteint!');
 $('#in').innerHTML=I.join('');

 // Graphique
 const ms=[5,4,3,2,1,0].map(n=>prev(mon,n)),dt=ms.map(m=>[sum(inM(m),'r'),sum(inM(m),'d')]),mx=Math.max(1,...dt.flat());
 $('#ch').innerHTML=ms.map((m,i)=>`<div><span><i style="height:${dt[i][0]/mx*100}%;background:var(--ok)"></i><i style="height:${dt[i][1]/mx*100}%;background:var(--ko)"></i></span>${m.slice(2)}</div>`).join('');

 // Opérations
 const rows=[...L].sort((a,b)=>b.date.localeCompare(a.date));
 $('#tb1').innerHTML='<tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Montant</th><th></th></tr>'+(rows.map(t=>`<tr><td>${t.date}</td><td>${esc(t.ds)}</td><td>${esc(t.ct||'')}</td><td class="${t.ty==='r'?'pos':'neg'}">${t.ty==='r'?'+':'−'}${$$(t.am)}</td><td><button class="s" data-x="${t.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="5">Aucune opération</td></tr>');

 // Objectifs
 const Y=D.tx.filter(t=>t.date.startsWith(mon.slice(0,4))),YR=sum(Y,'r');
 const gb=(l,a,b)=>b>0?`<div style="margin-bottom:12px"><b>${l}</b>: ${$$(a)} / ${$$(b)} (${pct(a,b)} %)<div class="bar"><i style="width:${pct(a,b)}%"></i></div></div>`:'';
 $('#gp').innerHTML=(gb('Revenus du mois',R,G.m)+gb('Profit net du mois',P,G.p)+gb('Revenus de l\'année',YR,G.y))||'<span style="color:var(--mu)">Définis tes objectifs ci-dessus pour suivre ta progression.</span>';
}

$('#mo').value=mon;$('#mo').onchange=e=>{mon=e.target.value||mon;render()};
$('#dt').value=today;
$('#ty').onchange=e=>$('#sw').classList.toggle('hid',e.target.value!=='r');
$('#ad').onclick=()=>{
 const am=parseFloat($('#am').value),ty=$('#ty').value,dt=$('#dt').value;
 if(!(am>0)||!dt){alert('Entre un montant et une date.');return}
 const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 D.tx.push({id:id(),ty,date:dt,ds:$('#ds').value||'—',ct:$('#ct').value,am,tb:$('#tb').value==='1'});
 if(ty==='r'&&$('#st').value==='1'){
  const tot=$('#tb').value==='1'?am*(1+TPS+TVQ):am;
  D.tx.push({id:id(),ty:'d',date:dt,ds:'Frais Stripe: '+($('#ds').value||'—'),ct:'Frais Stripe',am:+(tot*.029+.3).toFixed(2),tb:false});
 }
 save();['#ds','#am'].forEach(s=>$(s).value='');render();
};
$('#tb1').onclick=e=>{const x=e.target.dataset.x;if(!x||!confirm('Supprimer cette opération?'))return;D.tx=D.tx.filter(t=>t.id!==x);save();render()};
$('#g1').value=D.goals.m||'';$('#g2').value=D.goals.p||'';$('#g3').value=D.goals.y||'';
$('#gs').onclick=()=>{D.goals={m:+$('#g1').value||0,p:+$('#g2').value||0,y:+$('#g3').value||0};save();render()};

const dl=(n,c,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()};
$('#ej').onclick=()=>dl('sauvegarde-admin.json',JSON.stringify(D),'application/json');
$('#ec').onclick=()=>dl('operations.csv','Date;Type;Description;Categorie;Montant;Taxable\n'+D.tx.map(t=>[t.date,t.ty==='r'?'Revenu':'Depense','"'+t.ds.replace(/"/g,'""')+'"','"'+(t.ct||'')+'"',t.am,t.tb?'Oui':'Non'].join(';')).join('\n'),'text/csv');
$('#ij').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;D=d;D.goals=D.goals||{m:0,p:0,y:0};save();render();alert('Importé.')}catch(x){alert('Fichier invalide.')}};r.readAsText(f)};
render();
</script>
</body>
</html>
